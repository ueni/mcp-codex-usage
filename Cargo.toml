[package]
name = "usage-mcp-server"
version = "0.1.0"
edition = "2021"
description = "Small MCP server that reports usage data from a configured endpoint"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
